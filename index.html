<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AA-SI Data Roadmap</title>

  <!-- GitHub-style Markdown CSS -->

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown.min.css"
  >

  <style>
    html {
      background: #ffffff;
    }

    body {
      background: #ffffff;
      color: #24292f;
      max-width: 1200px;
      margin: 0 auto;
      padding: 45px;
    }

    .markdown-body {
      background: #ffffff;
      color: #24292f;
    }

    /* Force light theme for tables */
    .markdown-body table {
      background-color: #ffffff;
      color: #24292f;
      border-color: #d0d7de;
    }

    .markdown-body table tr {
      background-color: #ffffff;
      border-top-color: #d0d7de;
    }

    .markdown-body table tr:nth-child(2n) {
      background-color: #f6f8fa;
    }

    .markdown-body table th,
    .markdown-body table td {
      background-color: inherit;
      color: #24292f;
      border-color: #d0d7de;
    }

    /* Force light theme for code blocks */
    .markdown-body pre {
      background-color: #f6f8fa;
      color: #24292f;
      border: 1px solid #d0d7de;
    }

    .markdown-body code {
      background-color: #f6f8fa;
      color: #24292f;
    }

    .markdown-body pre code {
      background-color: transparent;
      color: #24292f;
    }

    /* Force light theme for blockquotes */
    .markdown-body blockquote {
      color: #57606a;
      border-left-color: #d0d7de;
    }

    /* Force light theme for horizontal rules */
    .markdown-body hr {
      background-color: #d0d7de;
      border: 0;
      height: 1px;
    }

    /* Force light theme for links */
    .markdown-body a {
      color: #0969da;
    }

    /* Force light theme for headings */
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      color: #1f2328;
    }

    /* Mobile layout */
    @media (max-width: 767px) {
      body {
        padding: 15px;
      }
    }
  </style>

</head>

<body>

  <!-- README content will be loaded here -->

  <article id="content" class="markdown-body">
    Loading...
  </article>

  <!-- Markdown parser -->

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Mermaid -->

  <script type="module">

    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

    // Initialize Mermaid
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "loose",
      theme: "default"
    });

    // Load and render README
    async function loadRoadmap() {

      const content = document.getElementById("content");

      try {

        // Make sure Marked loaded
        if (typeof marked === "undefined") {
          throw new Error("Marked.js failed to load.");
        }

        // Load README.md from GitHub
        const response = await fetch(
          "https://raw.githubusercontent.com/nmfs-ost/AA-SI_DataRoadMap/main/README.md"
        );

        if (!response.ok) {
          throw new Error(
            "Could not load README.md. HTTP status: " + response.status
          );
        }

        // Read README as text
        const markdown = await response.text();

        // Convert Markdown to HTML
        content.innerHTML = marked.parse(markdown);

        // Find Mermaid code blocks
        const blocks = document.querySelectorAll(
          "pre code.language-mermaid"
        );

        // Convert Mermaid code blocks into Mermaid containers
        blocks.forEach(function(code) {

          const pre = code.parentElement;

          const diagram = document.createElement("div");

          diagram.className = "mermaid";

          diagram.textContent = code.textContent;

          pre.replaceWith(diagram);

        });

        // Render Mermaid diagrams
        await mermaid.run({
          querySelector: ".mermaid"
        });

      } catch (error) {

        // Log error to browser console
        console.error(error);

        // Display error on page
        content.innerHTML =
          "<h1>Unable to load AA-SI Data Roadmap</h1>" +
          "<p>" + error.message + "</p>";

      }

    }

    // Start loading the roadmap
    loadRoadmap();

  </script>

</body>
</html>
