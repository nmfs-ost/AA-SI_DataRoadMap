  <!-- Load Markdown parser -->

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Load Mermaid -->

  <script type="module">

    import mermaid from
      'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: 'default'
    });

    async function loadRoadmap() {

      const content = document.getElementById('content');

      try {

        // Make sure Marked loaded
        if (typeof marked === 'undefined') {
          throw new Error('Marked.js did not load.');
        }

        // Load README
        const response = await fetch(
          'https://raw.githubusercontent.com/nmfs-ost/AA-SI_DataRoadMap/main/README.md'
        );

        if (!response.ok) {
          throw new Error(
            `README request failed: HTTP ${response.status}`
          );
        }

        const markdown = await response.text();

        // Convert Markdown to HTML
        const html = marked.parse(markdown);

        content.innerHTML = html;

        // Convert Mermaid code blocks
        const mermaidBlocks =
          document.querySelectorAll(
            'pre code.language-mermaid'
          );

        mermaidBlocks.forEach((code) => {

          const pre = code.closest('pre');

          const diagram = document.createElement('div');

          diagram.className = 'mermaid';

          diagram.textContent = code.textContent;

          pre.replaceWith(diagram);

        });

        // Render Mermaid
        await mermaid.run({
          querySelector: '.mermaid'
        });

      } catch (error) {

        console.error('Roadmap loading error:', error);

        content.innerHTML = `
          <h1>Unable to load AA-SI Data Roadmap</h1>

          <p>
            An error occurred while loading the README.
          </p>

          <pre>${error.message}</pre>

```
    `;

  }

}

// Wait until page is fully loaded
window.addEventListener(
  'DOMContentLoaded',
  loadRoadmap
