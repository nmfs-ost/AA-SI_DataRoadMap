<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AA-SI Data Roadmap</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown.min.css"
  >

  <style>
    body {
      max-width: 1200px;
      margin: 0 auto;
      padding: 45px;
    }

    @media (max-width: 767px) {
      body {
        padding: 15px;
      }
    }
  </style>

</head>

<body>

  <article id="content" class="markdown-body">
    Loading...
  </article>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script type="module">

    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "loose",
      theme: "default"
    });

    async function loadRoadmap() {

      const content = document.getElementById("content");

      try {

        if (typeof marked === "undefined") {
          throw new Error("Marked.js failed to load.");
        }

        const response = await fetch(
          "https://raw.githubusercontent.com/nmfs-ost/AA-SI_DataRoadMap/main/README.md"
        );

        if (!response.ok) {
          throw new Error(
            "Could not load README.md. HTTP status: " + response.status
          );
        }

        const markdown = await response.text();

        content.innerHTML = marked.parse(markdown);

        const blocks = document.querySelectorAll(
          "pre code.language-mermaid"
        );

        blocks.forEach(function(code) {

          const pre = code.parentElement;

          const diagram = document.createElement("div");

          diagram.className = "mermaid";

          diagram.textContent = code.textContent;

          pre.replaceWith(diagram);

        });

        await mermaid.run({
          querySelector: ".mermaid"
        });

      } catch (error) {

        console.error(error);

        content.innerHTML =
          "<h1>Unable to load AA-SI Data Roadmap</h1>" +
          "<p>" + error.message + "</p>";

      }

    }

    loadRoadmap();

  </script>

</body>
</html>
